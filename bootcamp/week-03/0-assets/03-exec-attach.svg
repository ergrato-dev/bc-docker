<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
  
  <!-- Fondo -->
  <rect width="900" height="420" fill="#1a1a2e"/>
  
  <!-- Título -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">exec vs attach</text>
  <text x="450" y="58" text-anchor="middle" fill="#a0a0a0" font-size="14">Diferencias entre ejecutar comandos y conectarse al proceso principal</text>
  
  <!-- EXEC (Izquierda) -->
  <rect x="50" y="85" width="380" height="300" rx="10" fill="#16213e" stroke="#43e97b" stroke-width="2"/>
  <rect x="50" y="85" width="380" height="35" rx="10" fill="#43e97b"/>
  <text x="240" y="108" text-anchor="middle" fill="#1a1a2e" font-size="16" font-weight="bold">docker exec</text>
  
  <!-- Contenedor exec -->
  <rect x="80" y="140" width="320" height="120" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="240" y="160" text-anchor="middle" fill="#667eea" font-size="12" font-weight="bold">📦 Contenedor</text>
  
  <!-- Proceso principal -->
  <rect x="100" y="175" width="120" height="55" rx="5" fill="#16213e" stroke="#667eea" stroke-width="1"/>
  <text x="160" y="195" text-anchor="middle" fill="#ffffff" font-size="10">Proceso Principal</text>
  <text x="160" y="215" text-anchor="middle" fill="#667eea" font-size="9">PID 1 (nginx)</text>
  
  <!-- Proceso exec (nuevo) -->
  <rect x="250" y="175" width="130" height="55" rx="5" fill="#16213e" stroke="#43e97b" stroke-width="2"/>
  <text x="315" y="195" text-anchor="middle" fill="#43e97b" font-size="10" font-weight="bold">Nuevo Proceso</text>
  <text x="315" y="215" text-anchor="middle" fill="#43e97b" font-size="9">PID 123 (/bin/sh)</text>
  
  <!-- Características exec -->
  <text x="70" y="285" fill="#43e97b" font-size="11">✓ Crea un NUEVO proceso</text>
  <text x="70" y="305" fill="#43e97b" font-size="11">✓ Independiente del principal</text>
  <text x="70" y="325" fill="#43e97b" font-size="11">✓ Puede ser interactivo (-it)</text>
  <text x="70" y="345" fill="#43e97b" font-size="11">✓ Terminar no afecta contenedor</text>
  <text x="70" y="365" fill="#ffffff" font-size="10" font-family="monospace">$ docker exec -it c1 /bin/sh</text>
  
  <!-- ATTACH (Derecha) -->
  <rect x="470" y="85" width="380" height="300" rx="10" fill="#16213e" stroke="#f5576c" stroke-width="2"/>
  <rect x="470" y="85" width="380" height="35" rx="10" fill="#f5576c"/>
  <text x="660" y="108" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">docker attach</text>
  
  <!-- Contenedor attach -->
  <rect x="500" y="140" width="320" height="120" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="660" y="160" text-anchor="middle" fill="#667eea" font-size="12" font-weight="bold">📦 Contenedor</text>
  
  <!-- Solo proceso principal con conexión -->
  <rect x="570" y="175" width="180" height="55" rx="5" fill="#16213e" stroke="#f5576c" stroke-width="2"/>
  <text x="660" y="195" text-anchor="middle" fill="#ffffff" font-size="10">Proceso Principal</text>
  <text x="660" y="215" text-anchor="middle" fill="#f5576c" font-size="9">PID 1 (conectado)</text>
  
  <!-- Terminal conectada -->
  <rect x="605" y="235" width="110" height="20" rx="3" fill="#f5576c" opacity="0.3"/>
  <text x="660" y="250" text-anchor="middle" fill="#f5576c" font-size="9">stdin/stdout</text>
  
  <!-- Características attach -->
  <text x="490" y="285" fill="#f5576c" font-size="11">⚠ Conecta al proceso EXISTENTE</text>
  <text x="490" y="305" fill="#f5576c" font-size="11">⚠ Comparte stdin/stdout/stderr</text>
  <text x="490" y="325" fill="#f5576c" font-size="11">⚠ Ctrl+C puede detener contenedor</text>
  <text x="490" y="345" fill="#f5576c" font-size="11">⚠ Usar Ctrl+P, Ctrl+Q para salir</text>
  <text x="490" y="365" fill="#ffffff" font-size="10" font-family="monospace">$ docker attach mi-contenedor</text>
  
  <!-- Recomendación -->
  <rect x="50" y="395" width="800" height="20" rx="5" fill="#43e97b" opacity="0.2"/>
  <text x="450" y="410" text-anchor="middle" fill="#43e97b" font-size="12" font-weight="bold">💡 Recomendación: Usa exec para debugging y attach solo cuando necesites el proceso principal</text>
</svg>
