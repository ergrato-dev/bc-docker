<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-log" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#43e97b"/>
    </marker>
  </defs>
  
  <!-- Fondo -->
  <rect width="900" height="400" fill="#1a1a2e"/>
  
  <!-- Título -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">Flujo de Logs en Docker</text>
  <text x="450" y="58" text-anchor="middle" fill="#a0a0a0" font-size="14">stdout y stderr del proceso hacia el logging driver</text>
  
  <!-- Contenedor -->
  <rect x="50" y="100" width="250" height="200" rx="10" fill="#16213e" stroke="#667eea" stroke-width="2"/>
  <text x="175" y="125" text-anchor="middle" fill="#667eea" font-size="14" font-weight="bold">📦 Contenedor</text>
  
  <!-- Proceso dentro del contenedor -->
  <rect x="80" y="145" width="190" height="80" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="175" y="170" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Proceso Principal (PID 1)</text>
  <text x="175" y="190" text-anchor="middle" fill="#43e97b" font-size="10">stdout → mensajes info</text>
  <text x="175" y="210" text-anchor="middle" fill="#f5576c" font-size="10">stderr → mensajes error</text>
  
  <!-- Streams saliendo -->
  <rect x="100" y="240" width="70" height="25" rx="5" fill="#43e97b"/>
  <text x="135" y="257" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">stdout</text>
  
  <rect x="180" y="240" width="70" height="25" rx="5" fill="#f5576c"/>
  <text x="215" y="257" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">stderr</text>
  
  <!-- Flechas hacia Docker Daemon -->
  <line x1="300" y1="200" x2="380" y2="200" stroke="#43e97b" stroke-width="3" marker-end="url(#arrow-log)"/>
  
  <!-- Docker Daemon -->
  <rect x="390" y="130" width="180" height="140" rx="10" fill="#16213e" stroke="#00d4ff" stroke-width="2"/>
  <text x="480" y="160" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">🐳 Docker Daemon</text>
  
  <rect x="410" y="175" width="140" height="40" rx="5" fill="#0d1117"/>
  <text x="480" y="195" text-anchor="middle" fill="#ffffff" font-size="11">Logging Driver</text>
  <text x="480" y="210" text-anchor="middle" fill="#a0a0a0" font-size="9">json-file (default)</text>
  
  <rect x="410" y="225" width="140" height="30" rx="5" fill="#0d1117"/>
  <text x="480" y="245" text-anchor="middle" fill="#a0a0a0" font-size="9">/var/lib/docker/containers/</text>
  
  <!-- Flechas hacia salidas -->
  <line x1="570" y1="170" x2="650" y2="120" stroke="#43e97b" stroke-width="2" marker-end="url(#arrow-log)"/>
  <line x1="570" y1="200" x2="650" y2="200" stroke="#667eea" stroke-width="2" marker-end="url(#arrow-log)"/>
  <line x1="570" y1="230" x2="650" y2="280" stroke="#f093fb" stroke-width="2" marker-end="url(#arrow-log)"/>
  
  <!-- Destinos -->
  <rect x="660" y="90" width="180" height="50" rx="8" fill="#16213e" stroke="#43e97b" stroke-width="2"/>
  <text x="750" y="112" text-anchor="middle" fill="#43e97b" font-size="12" font-weight="bold">docker logs</text>
  <text x="750" y="130" text-anchor="middle" fill="#a0a0a0" font-size="10">Terminal / CLI</text>
  
  <rect x="660" y="170" width="180" height="50" rx="8" fill="#16213e" stroke="#667eea" stroke-width="2"/>
  <text x="750" y="192" text-anchor="middle" fill="#667eea" font-size="12" font-weight="bold">Archivo JSON</text>
  <text x="750" y="210" text-anchor="middle" fill="#a0a0a0" font-size="10">*-json.log</text>
  
  <rect x="660" y="255" width="180" height="50" rx="8" fill="#16213e" stroke="#f093fb" stroke-width="2"/>
  <text x="750" y="277" text-anchor="middle" fill="#f093fb" font-size="12" font-weight="bold">Logging Externo</text>
  <text x="750" y="295" text-anchor="middle" fill="#a0a0a0" font-size="10">syslog, fluentd, etc</text>
  
  <!-- Comandos de ejemplo -->
  <rect x="50" y="320" width="800" height="65" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="342" fill="#43e97b" font-size="11" font-family="monospace">$ docker logs -f --tail 100 mi-contenedor</text>
  <text x="500" y="342" fill="#a0a0a0" font-size="10"># Últimas 100 líneas + follow</text>
  <text x="70" y="362" fill="#667eea" font-size="11" font-family="monospace">$ docker logs --since 1h --until 30m mi-contenedor</text>
  <text x="500" y="362" fill="#a0a0a0" font-size="10"># Logs de hace 1h hasta hace 30m</text>
  <text x="70" y="380" fill="#f093fb" font-size="11" font-family="monospace">$ docker logs -t mi-contenedor 2>&amp;1 | grep ERROR</text>
  <text x="500" y="380" fill="#a0a0a0" font-size="10"># Con timestamps, filtrar errores</text>
</svg>
