<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="vmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a5a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2496ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7bc9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="osGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0c929;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c757d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a6268;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#51cf66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40c057;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker vs Máquinas Virtuales</text>
  
  <!-- VM Side Title -->
  <text x="225" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff6b6b" text-anchor="middle">🖥️ Máquinas Virtuales</text>
  
  <!-- Docker Side Title -->
  <text x="675" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2496ED" text-anchor="middle">🐳 Contenedores Docker</text>
  
  <!-- Divider -->
  <line x1="450" y1="90" x2="450" y2="480" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,5" opacity="0.3"/>
  
  <!-- VM STACK -->
  <!-- Hardware -->
  <rect x="50" y="420" width="350" height="50" rx="5" fill="url(#hwGrad)"/>
  <text x="225" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hardware / Infraestructura</text>
  
  <!-- Host OS -->
  <rect x="50" y="360" width="350" height="50" rx="5" fill="url(#osGrad)"/>
  <text x="225" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Sistema Operativo Host</text>
  
  <!-- Hypervisor -->
  <rect x="50" y="300" width="350" height="50" rx="5" fill="url(#vmGrad)"/>
  <text x="225" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hypervisor (VMware, VirtualBox)</text>
  
  <!-- VMs -->
  <g>
    <!-- VM 1 -->
    <rect x="55" y="110" width="105" height="180" rx="5" fill="#2d2d44" stroke="#ff6b6b" stroke-width="2"/>
    <rect x="60" y="235" width="95" height="25" rx="3" fill="url(#osGrad)"/>
    <text x="107" y="252" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">Guest OS</text>
    <rect x="60" y="200" width="95" height="30" rx="3" fill="#4a4a6a"/>
    <text x="107" y="219" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Bins/Libs</text>
    <rect x="60" y="120" width="95" height="75" rx="3" fill="url(#appGrad)"/>
    <text x="107" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">App A</text>
    <text x="107" y="175" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">+ dependencias</text>
  </g>
  
  <g>
    <!-- VM 2 -->
    <rect x="172" y="110" width="105" height="180" rx="5" fill="#2d2d44" stroke="#ff6b6b" stroke-width="2"/>
    <rect x="177" y="235" width="95" height="25" rx="3" fill="url(#osGrad)"/>
    <text x="224" y="252" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">Guest OS</text>
    <rect x="177" y="200" width="95" height="30" rx="3" fill="#4a4a6a"/>
    <text x="224" y="219" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Bins/Libs</text>
    <rect x="177" y="120" width="95" height="75" rx="3" fill="url(#appGrad)"/>
    <text x="224" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">App B</text>
    <text x="224" y="175" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">+ dependencias</text>
  </g>
  
  <g>
    <!-- VM 3 -->
    <rect x="289" y="110" width="105" height="180" rx="5" fill="#2d2d44" stroke="#ff6b6b" stroke-width="2"/>
    <rect x="294" y="235" width="95" height="25" rx="3" fill="url(#osGrad)"/>
    <text x="341" y="252" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">Guest OS</text>
    <rect x="294" y="200" width="95" height="30" rx="3" fill="#4a4a6a"/>
    <text x="341" y="219" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Bins/Libs</text>
    <rect x="294" y="120" width="95" height="75" rx="3" fill="url(#appGrad)"/>
    <text x="341" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">App C</text>
    <text x="341" y="175" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">+ dependencias</text>
  </g>
  
  <!-- DOCKER STACK -->
  <!-- Hardware -->
  <rect x="500" y="420" width="350" height="50" rx="5" fill="url(#hwGrad)"/>
  <text x="675" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hardware / Infraestructura</text>
  
  <!-- Host OS -->
  <rect x="500" y="360" width="350" height="50" rx="5" fill="url(#osGrad)"/>
  <text x="675" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Sistema Operativo Host</text>
  
  <!-- Docker Engine -->
  <rect x="500" y="300" width="350" height="50" rx="5" fill="url(#dockerGrad)"/>
  <text x="675" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🐳 Docker Engine</text>
  
  <!-- Containers -->
  <g>
    <!-- Container 1 -->
    <rect x="505" y="185" width="105" height="105" rx="5" fill="#2d2d44" stroke="#2496ED" stroke-width="2"/>
    <rect x="510" y="255" width="95" height="30" rx="3" fill="#4a4a6a"/>
    <text x="557" y="274" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Bins/Libs</text>
    <rect x="510" y="195" width="95" height="55" rx="3" fill="url(#appGrad)"/>
    <text x="557" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">App A</text>
  </g>
  
  <g>
    <!-- Container 2 -->
    <rect x="622" y="185" width="105" height="105" rx="5" fill="#2d2d44" stroke="#2496ED" stroke-width="2"/>
    <rect x="627" y="255" width="95" height="30" rx="3" fill="#4a4a6a"/>
    <text x="674" y="274" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Bins/Libs</text>
    <rect x="627" y="195" width="95" height="55" rx="3" fill="url(#appGrad)"/>
    <text x="674" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">App B</text>
  </g>
  
  <g>
    <!-- Container 3 -->
    <rect x="739" y="185" width="105" height="105" rx="5" fill="#2d2d44" stroke="#2496ED" stroke-width="2"/>
    <rect x="744" y="255" width="95" height="30" rx="3" fill="#4a4a6a"/>
    <text x="791" y="274" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Bins/Libs</text>
    <rect x="744" y="195" width="95" height="55" rx="3" fill="url(#appGrad)"/>
    <text x="791" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">App C</text>
  </g>
  
  <!-- Comparison Labels -->
  <text x="225" y="485" font-family="Arial, sans-serif" font-size="12" fill="#ff6b6b" text-anchor="middle">❌ Más recursos | ❌ Inicio lento | ❌ OS completo</text>
  <text x="675" y="485" font-family="Arial, sans-serif" font-size="12" fill="#51cf66" text-anchor="middle">✅ Ligero | ✅ Inicio rápido | ✅ Kernel compartido</text>
  
  <!-- Height indicators -->
  <line x1="420" y1="110" x2="420" y2="290" stroke="#ff6b6b" stroke-width="2"/>
  <text x="430" y="200" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b">GB</text>
  
  <line x1="470" y1="185" x2="470" y2="290" stroke="#2496ED" stroke-width="2"/>
  <text x="480" y="240" font-family="Arial, sans-serif" font-size="10" fill="#2496ED">MB</text>
</svg>