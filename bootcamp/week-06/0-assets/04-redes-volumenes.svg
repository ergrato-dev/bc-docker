<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <style>
      .title   { font-family:'Courier New',monospace; font-size:18px; font-weight:bold; fill:#38bdf8; }
      .label   { font-family:'Courier New',monospace; font-size:10px; fill:#fff; font-weight:bold; }
      .sublabel{ font-family:'Courier New',monospace; font-size:9px; fill:#94a3b8; }
      .cmd     { font-family:'Courier New',monospace; font-size:9px; fill:#4ade80; }
      .netname { font-family:'Courier New',monospace; font-size:11px; font-weight:bold; }
      .note    { font-family:'Courier New',monospace; font-size:9px; fill:#fbbf24; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="12"/>
  <rect width="900" height="400" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" rx="12"/>

  <text x="450" y="28" class="title" text-anchor="middle">Redes y Volúmenes en Docker Compose</text>

  <!-- Internet cloud -->
  <ellipse cx="60" cy="160" rx="45" ry="30" fill="#0f2a4a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="156" class="label" text-anchor="middle" fill="#38bdf8">INTER</text>
  <text x="60" y="170" class="label" text-anchor="middle" fill="#38bdf8">NET</text>
  <text x="60" y="184" class="sublabel" text-anchor="middle">:80/:443</text>

  <!-- public-net zone -->
  <rect x="125" y="100" width="300" height="130" rx="10" fill="#052e16" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="275" y="118" class="netname" text-anchor="middle" fill="#10b981">public-net</text>
  <text x="275" y="132" class="sublabel" text-anchor="middle">internet-accesible</text>

  <!-- nginx service box -->
  <rect x="140" y="140" width="100" height="70" rx="8" fill="#0f3a2a" stroke="#10b981" stroke-width="1.5"/>
  <text x="190" y="162" class="label" text-anchor="middle">nginx</text>
  <text x="190" y="176" class="sublabel" text-anchor="middle">reverse proxy</text>
  <text x="190" y="190" class="cmd" text-anchor="middle">:80→80</text>
  <text x="190" y="204" class="sublabel" text-anchor="middle">ports: 80:80</text>

  <!-- api service box (both networks) -->
  <rect x="300" y="140" width="100" height="70" rx="8" fill="#0f3a2a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="300" y="140" width="100" height="70" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="350" y="162" class="label" text-anchor="middle">api</text>
  <text x="350" y="176" class="sublabel" text-anchor="middle">app server</text>
  <text x="350" y="190" class="sublabel" text-anchor="middle">public-net</text>
  <text x="350" y="204" class="sublabel" fill="#a78bfa" text-anchor="middle">+ internal-net</text>

  <!-- internal-net zone -->
  <rect x="420" y="100" width="360" height="130" rx="10" fill="#1a0a3a" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="118" class="netname" text-anchor="middle" fill="#a78bfa">internal-net</text>
  <text x="600" y="132" class="sublabel" text-anchor="middle">internal: true — sin acceso a internet</text>

  <!-- db service box -->
  <rect x="435" y="140" width="100" height="70" rx="8" fill="#1e0a3a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="485" y="162" class="label" text-anchor="middle">db</text>
  <text x="485" y="176" class="sublabel" text-anchor="middle">postgres</text>
  <text x="485" y="190" class="cmd" text-anchor="middle">:5432</text>
  <text x="485" y="204" class="sublabel" fill="#a78bfa" text-anchor="middle">vol: db-data</text>

  <!-- cache service box -->
  <rect x="565" y="140" width="100" height="70" rx="8" fill="#1e0a3a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="615" y="162" class="label" text-anchor="middle">cache</text>
  <text x="615" y="176" class="sublabel" text-anchor="middle">redis</text>
  <text x="615" y="190" class="cmd" text-anchor="middle">:6379</text>
  <text x="615" y="204" class="sublabel" fill="#a78bfa" text-anchor="middle">sin volumen</text>

  <!-- Connection arrows -->
  <!-- internet → nginx -->
  <line x1="106" y1="160" x2="138" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- nginx → api (public-net) -->
  <line x1="241" y1="175" x2="298" y2="175" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- api → db (internal-net) -->
  <line x1="401" y1="175" x2="433" y2="175" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <!-- api → cache (internal-net) -->
  <path d="M 401 165 Q 500 135 563 165" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <!-- Cannot reach internet from internal-net -->
  <line x1="695" y1="165" x2="760" y2="165" stroke="#f87171" stroke-width="2"/>
  <circle cx="762" cy="165" r="12" fill="#1a0505" stroke="#ef4444" stroke-width="1.5"/>
  <text x="762" y="169" class="label" text-anchor="middle" fill="#f87171">🚫</text>
  <ellipse cx="830" cy="165" rx="40" ry="22" fill="#0f2a4a" stroke="#475569" stroke-width="1"/>
  <text x="830" y="162" class="sublabel" text-anchor="middle">internet</text>
  <text x="830" y="175" class="sublabel" text-anchor="middle" fill="#f87171">bloqueado</text>

  <!-- Compose YAML section -->
  <rect x="15" y="248" width="545" height="136" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="25" y="266" class="label" fill="#38bdf8">docker-compose.yml</text>
  <text x="25" y="284" class="cmd" xml:space="preserve">networks:</text>
  <text x="25" y="298" class="cmd" xml:space="preserve">  <tspan fill="#10b981">public-net:</tspan></text>
  <text x="25" y="312" class="cmd" xml:space="preserve">  <tspan fill="#a78bfa">internal-net:</tspan></text>
  <text x="25" y="326" class="cmd" xml:space="preserve">    <tspan fill="#94a3b8">internal: </tspan><tspan fill="#f87171">true</tspan></text>
  <line x1="185" y1="254" x2="185" y2="380" stroke="#334155"/>
  <text x="195" y="284" class="cmd" xml:space="preserve">volumes:</text>
  <text x="195" y="298" class="cmd" xml:space="preserve">  <tspan fill="#fbbf24">db-data:</tspan><tspan fill="#94a3b8">  # named volume</tspan></text>
  <text x="195" y="322" class="sublabel" xml:space="preserve">services.db:</text>
  <text x="195" y="336" class="cmd" xml:space="preserve">  volumes:</text>
  <text x="195" y="350" class="cmd" xml:space="preserve">    - <tspan fill="#fbbf24">db-data</tspan><tspan fill="#94a3b8">:/var/lib/postgresql/data</tspan></text>
  <text x="195" y="364" class="sublabel" xml:space="preserve">  networks: [internal-net]</text>
  <text x="195" y="378" class="sublabel" xml:space="preserve">services.nginx.networks:[public-net]</text>

  <!-- Legend panel -->
  <rect x="575" y="248" width="310" height="136" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="730" y="266" class="label" text-anchor="middle" fill="#38bdf8">Leyenda</text>
  <line x1="590" y1="274" x2="610" y2="274" stroke="#38bdf8" stroke-width="2"/>
  <text x="620" y="278" class="sublabel">Tráfico desde internet</text>
  <line x1="590" y1="294" x2="610" y2="294" stroke="#10b981" stroke-width="2"/>
  <text x="620" y="298" class="sublabel">Comunicación public-net</text>
  <line x1="590" y1="314" x2="610" y2="314" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="620" y="318" class="sublabel">Comunicación internal-net</text>
  <rect x="590" y="328" width="20" height="12" rx="2" fill="#064e3b" stroke="#10b981"/>
  <text x="620" y="338" class="sublabel">Servicio en public-net</text>
  <rect x="590" y="346" width="20" height="12" rx="2" fill="#1e0a3a" stroke="#7c3aed"/>
  <text x="620" y="356" class="sublabel">Servicio en internal-net (aislado)</text>
  <text x="730" y="378" class="note" text-anchor="middle">internal-net: sin ruta de salida a internet</text>
</svg>
