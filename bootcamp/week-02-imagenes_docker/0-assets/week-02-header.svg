<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
  
  <!-- Fondo -->
  <rect width="900" height="200" fill="#1a1a2e"/>
  
  <!-- Patrón decorativo -->
  <rect x="50" y="30" width="100" height="8" rx="4" fill="#667eea" opacity="0.3"/>
  <rect x="50" y="45" width="80" height="8" rx="4" fill="#764ba2" opacity="0.3"/>
  <rect x="50" y="60" width="120" height="8" rx="4" fill="#f093fb" opacity="0.3"/>
  <rect x="730" y="130" width="100" height="8" rx="4" fill="#667eea" opacity="0.3"/>
  <rect x="750" y="145" width="80" height="8" rx="4" fill="#764ba2" opacity="0.3"/>
  <rect x="710" y="160" width="120" height="8" rx="4" fill="#f093fb" opacity="0.3"/>
  
  <!-- Icono de capas (izquierda) -->
  <rect x="200" y="60" width="120" height="25" rx="5" fill="#43e97b"/>
  <rect x="200" y="80" width="120" height="25" rx="5" fill="#667eea"/>
  <rect x="200" y="100" width="120" height="25" rx="5" fill="#f093fb"/>
  <rect x="200" y="120" width="120" height="25" rx="5" fill="#ffd93d"/>
  <text x="260" y="77" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">FROM</text>
  <text x="260" y="97" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">RUN</text>
  <text x="260" y="117" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">COPY</text>
  <text x="260" y="137" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="bold">CMD</text>
  
  <!-- Título principal -->
  <text x="450" y="85" text-anchor="middle" fill="#667eea" font-size="42" font-weight="bold">Semana 02</text>
  <text x="450" y="125" text-anchor="middle" fill="#ffffff" font-size="28">Imágenes Docker</text>
  
  <!-- Subtítulo -->
  <text x="450" y="160" text-anchor="middle" fill="#a0a0a0" font-size="14">Dockerfile • Multi-Stage • Optimización • Build Context</text>
  
  <!-- Docker whale icon (derecha) -->
  <ellipse cx="680" cy="100" rx="50" ry="35" fill="#00d4ff" opacity="0.2"/>
  <text x="680" y="115" text-anchor="middle" fill="#00d4ff" font-size="50">🐳</text>
  
  <!-- Badge semana -->
  <rect x="800" y="20" width="80" height="30" rx="15" fill="#667eea"/>
  <text x="840" y="40" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">WEEK 02</text>
</svg>