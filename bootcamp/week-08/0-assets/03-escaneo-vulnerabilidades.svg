<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a0505"/>
    </linearGradient>
    <style>
      .title   { font-family:'Courier New',monospace; font-size:18px; font-weight:bold; fill:#f87171; }
      .label   { font-family:'Courier New',monospace; font-size:10px; fill:#fff; font-weight:bold; }
      .sublabel{ font-family:'Courier New',monospace; font-size:9px; fill:#94a3b8; }
      .cmd     { font-family:'Courier New',monospace; font-size:9px; fill:#4ade80; }
      .key     { font-family:'Courier New',monospace; font-size:9px; fill:#a78bfa; }
      .note    { font-family:'Courier New',monospace; font-size:9px; fill:#fbbf24; }
      .crit    { font-family:'Courier New',monospace; font-size:9px; fill:#f87171; font-weight:bold; }
      .high    { font-family:'Courier New',monospace; font-size:9px; fill:#fb923c; }
      .med     { font-family:'Courier New',monospace; font-size:9px; fill:#fbbf24; }
      .low     { font-family:'Courier New',monospace; font-size:9px; fill:#4ade80; }
    </style>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="900" height="390" fill="url(#bg)" rx="12"/>
  <rect width="900" height="390" fill="none" stroke="#dc2626" stroke-width="1" stroke-opacity="0.5" rx="12"/>

  <text x="450" y="28" class="title" text-anchor="middle">Escaneo de Vulnerabilidades — CVE y Trivy</text>

  <!-- CVE Pyramid (left) -->
  <rect x="20" y="44" width="280" height="196" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="160" y="64" class="label" text-anchor="middle" fill="#f87171">Severidad CVE</text>

  <!-- CRITICAL bar -->
  <rect x="80" y="76" width="160" height="28" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="95" class="crit" text-anchor="middle">CRITICAL  (9.0–10.0)</text>
  <text x="40" y="95" class="sublabel" text-anchor="end">🔴</text>

  <!-- HIGH bar -->
  <rect x="60" y="110" width="200" height="28" rx="4" fill="#431407" stroke="#f97316" stroke-width="1"/>
  <text x="160" y="129" class="high" text-anchor="middle">HIGH  (7.0–8.9)</text>
  <text x="40" y="129" class="sublabel" text-anchor="end">🟠</text>

  <!-- MEDIUM bar -->
  <rect x="40" y="144" width="240" height="28" rx="4" fill="#451a03" stroke="#fbbf24" stroke-width="1"/>
  <text x="160" y="163" class="med" text-anchor="middle">MEDIUM  (4.0–6.9)</text>
  <text x="40" y="163" class="sublabel" text-anchor="end">🟡</text>

  <!-- LOW bar -->
  <rect x="20" y="178" width="280" height="28" rx="4" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
  <text x="160" y="197" class="low" text-anchor="middle">LOW  (0.1–3.9)</text>
  <text x="10" y="197" class="sublabel" text-anchor="end">🟢</text>

  <text x="160" y="228" class="sublabel" text-anchor="middle">CVSS Score → prioridad de remediación</text>

  <!-- Trivy scan pipeline (center + right) -->
  <rect x="320" y="44" width="560" height="196" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="600" y="64" class="label" text-anchor="middle" fill="#f87171">Pipeline de Escaneo con Trivy</text>

  <!-- Step 1 -->
  <rect x="335" y="75" width="92" height="50" rx="6" fill="#1a1a0f" stroke="#fbbf24" stroke-width="1"/>
  <text x="381" y="96" class="note" text-anchor="middle">① código</text>
  <text x="381" y="110" class="sublabel" text-anchor="middle">git push</text>

  <line x1="428" y1="100" x2="452" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <!-- Step 2 -->
  <rect x="454" y="75" width="92" height="50" rx="6" fill="#0f2a4a" stroke="#38bdf8" stroke-width="1"/>
  <text x="500" y="96" class="label" text-anchor="middle" fill="#38bdf8">② build</text>
  <text x="500" y="110" class="sublabel" text-anchor="middle">docker build</text>

  <line x1="547" y1="100" x2="571" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <!-- Step 3 -->
  <rect x="573" y="75" width="92" height="50" rx="6" fill="#1a0505" stroke="#ef4444" stroke-width="1"/>
  <text x="619" y="92" class="crit" text-anchor="middle">③ scan</text>
  <text x="619" y="106" class="sublabel" text-anchor="middle">trivy image</text>
  <text x="619" y="120" class="sublabel" text-anchor="middle">my-app:latest</text>

  <line x1="666" y1="100" x2="690" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <!-- Step 4: pass/fail -->
  <rect x="692" y="75" width="92" height="50" rx="6" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
  <text x="738" y="92" class="cmd" text-anchor="middle">④ gate</text>
  <text x="738" y="106" class="sublabel" text-anchor="middle">fail si CRIT/HIGH</text>
  <text x="738" y="120" class="sublabel" text-anchor="middle">--exit-code 1</text>

  <!-- pass arrow and push -->
  <line x1="784" y1="100" x2="858" y2="100" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <text x="848" y="92" class="cmd" text-anchor="end">✅ push</text>

  <!-- fail arrow down -->
  <line x1="738" y1="126" x2="738" y2="158" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="734,156 738,164 742,156" fill="#ef4444"/>
  <text x="748" y="148" class="crit" text-anchor="start">❌ bloqueado</text>

  <!-- Trivy command examples -->
  <text x="335" y="182" class="note">Comandos Trivy</text>
  <text x="335" y="198" class="cmd" xml:space="preserve">trivy image --severity CRITICAL,HIGH  my-app:latest</text>
  <text x="335" y="214" class="cmd" xml:space="preserve">trivy image --exit-code 1 --ignore-unfixed  my-app:latest</text>
  <text x="335" y="228" class="cmd" xml:space="preserve">trivy fs .     <tspan class="sublabel"># escanear filesystem o repo local</tspan></text>

  <!-- Fix strategies -->
  <rect x="20" y="256" width="860" height="116" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="276" class="label" text-anchor="middle" fill="#f87171">Estrategias de Remediación</text>
  <line x1="20" y1="284" x2="880" y2="284" stroke="#334155"/>

  <text x="50" y="302" class="note" text-anchor="middle">CRITICAL</text>
  <text x="50" y="316" class="sublabel" text-anchor="middle">actualizar ahora</text>

  <text x="260" y="302" class="label" fill="#fb923c" text-anchor="middle">HIGH →</text>
  <text x="260" y="316" class="sublabel" text-anchor="middle">dentro de 1 semana</text>

  <text x="500" y="302" class="label" fill="#fbbf24" text-anchor="middle">Imagen base reciente →</text>
  <text x="500" y="316" class="sublabel" text-anchor="middle">usar slim/alpine con menos paquetes</text>

  <text x="760" y="302" class="label" fill="#4ade80" text-anchor="middle">LOW →</text>
  <text x="760" y="316" class="sublabel" text-anchor="middle">aceptar si no hay fix</text>

  <text x="450" y="360" class="note" text-anchor="middle">Integrar trivy en CI como GitHub Actions / GitLab CI para detectar CVEs antes de producción</text>
</svg>
