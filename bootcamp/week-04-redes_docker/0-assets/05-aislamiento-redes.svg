<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <!-- Fondo -->
  <rect width="900" height="400" fill="#1a1a2e"/>
  
  <!-- Titulo -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif">Aislamiento de Redes</text>
  <text x="450" y="58" text-anchor="middle" fill="#a0a0a0" font-size="14" font-family="sans-serif">Segmentacion y seguridad con redes separadas</text>
  
  <!-- Red Frontend -->
  <rect x="50" y="80" width="380" height="140" rx="10" fill="#16213e" stroke="#43e97b" stroke-width="2"/>
  <text x="240" y="105" text-anchor="middle" fill="#43e97b" font-size="14" font-weight="bold" font-family="sans-serif">frontend-network</text>
  
  <rect x="70" y="120" width="100" height="80" rx="5" fill="#0d1117" stroke="#43e97b" stroke-width="1"/>
  <text x="120" y="150" text-anchor="middle" fill="#43e97b" font-size="10" font-weight="bold" font-family="sans-serif">nginx</text>
  <text x="120" y="175" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.18.0.2</text>
  
  <rect x="190" y="120" width="100" height="80" rx="5" fill="#0d1117" stroke="#43e97b" stroke-width="1"/>
  <text x="240" y="150" text-anchor="middle" fill="#43e97b" font-size="10" font-weight="bold" font-family="sans-serif">web-app</text>
  <text x="240" y="175" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.18.0.3</text>
  
  <!-- API en ambas redes -->
  <rect x="310" y="120" width="100" height="80" rx="5" fill="#667eea"/>
  <text x="360" y="145" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif">api</text>
  <text x="360" y="165" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.18.0.4</text>
  <text x="360" y="185" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.19.0.2</text>
  
  <!-- Red Backend -->
  <rect x="470" y="80" width="380" height="140" rx="10" fill="#16213e" stroke="#f093fb" stroke-width="2"/>
  <text x="660" y="105" text-anchor="middle" fill="#f093fb" font-size="14" font-weight="bold" font-family="sans-serif">backend-network</text>
  
  <!-- API duplicado visual -->
  <rect x="490" y="120" width="100" height="80" rx="5" fill="#667eea"/>
  <text x="540" y="145" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif">api</text>
  <text x="540" y="165" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.18.0.4</text>
  <text x="540" y="185" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.19.0.2</text>
  
  <rect x="610" y="120" width="100" height="80" rx="5" fill="#0d1117" stroke="#f093fb" stroke-width="1"/>
  <text x="660" y="150" text-anchor="middle" fill="#f093fb" font-size="10" font-weight="bold" font-family="sans-serif">postgres</text>
  <text x="660" y="175" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.19.0.3</text>
  
  <rect x="730" y="120" width="100" height="80" rx="5" fill="#0d1117" stroke="#f093fb" stroke-width="1"/>
  <text x="780" y="150" text-anchor="middle" fill="#f093fb" font-size="10" font-weight="bold" font-family="sans-serif">redis</text>
  <text x="780" y="175" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">172.19.0.4</text>
  
  <!-- Conexion entre redes (api) -->
  <line x1="410" y1="160" x2="490" y2="160" stroke="#667eea" stroke-width="3" stroke-dasharray="5,3"/>
  
  <!-- Zona de comunicacion -->
  <rect x="50" y="240" width="800" height="140" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="265" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Matriz de Comunicacion</text>
  
  <!-- Tabla de comunicacion -->
  <text x="100" y="295" fill="#43e97b" font-size="11" font-family="sans-serif">nginx</text>
  <text x="200" y="295" fill="#ffffff" font-size="11" font-family="sans-serif">puede hablar con</text>
  <text x="340" y="295" fill="#43e97b" font-size="11" font-family="sans-serif">web-app, api</text>
  
  <text x="100" y="320" fill="#43e97b" font-size="11" font-family="sans-serif">web-app</text>
  <text x="200" y="320" fill="#ffffff" font-size="11" font-family="sans-serif">puede hablar con</text>
  <text x="340" y="320" fill="#43e97b" font-size="11" font-family="sans-serif">nginx, api</text>
  
  <text x="100" y="345" fill="#667eea" font-size="11" font-family="sans-serif">api</text>
  <text x="200" y="345" fill="#ffffff" font-size="11" font-family="sans-serif">puede hablar con</text>
  <text x="340" y="345" fill="#667eea" font-size="11" font-family="sans-serif">TODOS (en ambas redes)</text>
  
  <text x="500" y="295" fill="#f093fb" font-size="11" font-family="sans-serif">postgres</text>
  <text x="600" y="295" fill="#ffffff" font-size="11" font-family="sans-serif">puede hablar con</text>
  <text x="740" y="295" fill="#f093fb" font-size="11" font-family="sans-serif">api, redis</text>
  
  <text x="500" y="320" fill="#f093fb" font-size="11" font-family="sans-serif">redis</text>
  <text x="600" y="320" fill="#ffffff" font-size="11" font-family="sans-serif">puede hablar con</text>
  <text x="740" y="320" fill="#f093fb" font-size="11" font-family="sans-serif">api, postgres</text>
  
  <text x="500" y="345" fill="#f093fb" font-size="11" font-family="sans-serif">postgres/redis</text>
  <text x="620" y="345" fill="#ff6b6b" font-size="11" font-weight="bold" font-family="sans-serif">NO pueden hablar con</text>
  <text x="790" y="345" fill="#ff6b6b" font-size="11" font-family="sans-serif">nginx/web</text>
</svg>
