<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="createdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#868e96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c757d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="runningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#51cf66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40c057;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pausedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd43b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fab005;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stoppedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fa5252;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="exitedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#495057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#343a40;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#51cf66"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd43b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="400" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">🔄 Ciclo de Vida del Contenedor</text>
  
  <!-- CREATED State -->
  <rect x="50" y="150" width="120" height="70" rx="10" fill="url(#createdGrad)"/>
  <text x="110" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">📦 CREATED</text>
  <text x="110" y="200" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">docker create</text>
  
  <!-- RUNNING State -->
  <rect x="250" y="150" width="120" height="70" rx="10" fill="url(#runningGrad)"/>
  <text x="310" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">▶ RUNNING</text>
  <text x="310" y="200" font-family="Arial, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle">docker start</text>
  
  <!-- PAUSED State -->
  <rect x="450" y="80" width="120" height="70" rx="10" fill="url(#pausedGrad)"/>
  <text x="510" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e" text-anchor="middle">⏸ PAUSED</text>
  <text x="510" y="130" font-family="Arial, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle">docker pause</text>
  
  <!-- STOPPED State -->
  <rect x="450" y="220" width="120" height="70" rx="10" fill="url(#stoppedGrad)"/>
  <text x="510" y="250" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⏹ STOPPED</text>
  <text x="510" y="270" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">docker stop</text>
  
  <!-- EXITED/REMOVED State -->
  <rect x="650" y="150" width="120" height="70" rx="10" fill="url(#exitedGrad)"/>
  <text x="710" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🗑️ REMOVED</text>
  <text x="710" y="200" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">docker rm</text>
  
  <!-- IMAGE (Start point) -->
  <rect x="50" y="60" width="120" height="50" rx="5" fill="#2496ED"/>
  <text x="110" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🐳 Imagen</text>
  
  <!-- Arrows -->
  <!-- Image to Created -->
  <line x1="110" y1="110" x2="110" y2="140" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="145" y="130" font-family="monospace" font-size="9" fill="#aaaaaa">docker create</text>
  
  <!-- Created to Running -->
  <line x1="170" y1="185" x2="240" y2="185" stroke="#51cf66" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="205" y="175" font-family="monospace" font-size="9" fill="#51cf66">start</text>
  
  <!-- Running to Paused -->
  <path d="M 370 165 Q 410 115 440 115" stroke="#ffd43b" stroke-width="2" fill="none" marker-end="url(#arrowYellow)"/>
  <text x="385" y="125" font-family="monospace" font-size="9" fill="#ffd43b">pause</text>
  
  <!-- Paused to Running -->
  <path d="M 440 130 Q 400 175 370 175" stroke="#51cf66" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="385" y="165" font-family="monospace" font-size="9" fill="#51cf66">unpause</text>
  
  <!-- Running to Stopped -->
  <path d="M 370 205 Q 410 255 440 255" stroke="#ff6b6b" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="385" y="245" font-family="monospace" font-size="9" fill="#ff6b6b">stop/kill</text>
  
  <!-- Stopped to Running -->
  <path d="M 440 240 Q 400 195 370 195" stroke="#51cf66" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="380" y="210" font-family="monospace" font-size="9" fill="#51cf66">start</text>
  
  <!-- Stopped to Removed -->
  <line x1="570" y1="255" x2="640" y2="205" stroke="#868e96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="245" font-family="monospace" font-size="9" fill="#aaaaaa">rm</text>
  
  <!-- Direct Image to Running (docker run) -->
  <path d="M 170 75 Q 300 40 310 140" stroke="#2496ED" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="5,3"/>
  <text x="250" y="55" font-family="monospace" font-size="10" fill="#2496ED" font-weight="bold">docker run</text>
  
  <!-- Legend -->
  <rect x="50" y="310" width="800" height="75" rx="5" fill="#2d2d44"/>
  <text x="450" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Comandos Clave</text>
  
  <rect x="70" y="350" width="12" height="12" rx="2" fill="#2496ED"/>
  <text x="90" y="361" font-family="monospace" font-size="10" fill="#ffffff">docker run = create + start</text>
  
  <rect x="280" y="350" width="12" height="12" rx="2" fill="#51cf66"/>
  <text x="300" y="361" font-family="monospace" font-size="10" fill="#ffffff">docker start (inicia)</text>
  
  <rect x="460" y="350" width="12" height="12" rx="2" fill="#ff6b6b"/>
  <text x="480" y="361" font-family="monospace" font-size="10" fill="#ffffff">docker stop (detiene)</text>
  
  <rect x="640" y="350" width="12" height="12" rx="2" fill="#868e96"/>
  <text x="660" y="361" font-family="monospace" font-size="10" fill="#ffffff">docker rm (elimina)</text>
</svg>