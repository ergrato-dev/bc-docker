<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#845ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7048e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#339af0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228be6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layerGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12b886;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layerGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fcc419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fab005;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rwLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#51cf66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40c057;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">📦 Imágenes y Capas de Docker</text>
  
  <!-- IMAGE Section -->
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2496ED" text-anchor="middle">🐳 Imagen (Read-Only)</text>
  
  <!-- Image Layers Stack -->
  <g transform="translate(50, 90)">
    <!-- Base Layer -->
    <rect x="0" y="200" width="300" height="50" rx="5" fill="url(#layerGrad1)"/>
    <text x="150" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Capa Base: alpine:3.19</text>
    <text x="150" y="242" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">FROM alpine:3.19</text>
    
    <!-- Layer 2 -->
    <rect x="0" y="145" width="300" height="50" rx="5" fill="url(#layerGrad2)"/>
    <text x="150" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Capa 2: Dependencias</text>
    <text x="150" y="187" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">RUN apk add --no-cache nodejs npm</text>
    
    <!-- Layer 3 -->
    <rect x="0" y="90" width="300" height="50" rx="5" fill="url(#layerGrad3)"/>
    <text x="150" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Capa 3: Código Fuente</text>
    <text x="150" y="132" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">COPY . /app</text>
    
    <!-- Layer 4 -->
    <rect x="0" y="35" width="300" height="50" rx="5" fill="url(#layerGrad4)"/>
    <text x="150" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Capa 4: Configuración</text>
    <text x="150" y="77" font-family="Arial, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle">EXPOSE 3000 &amp;&amp; CMD ["node", "app.js"]</text>
    
    <!-- R/O indicator -->
    <text x="320" y="160" font-family="Arial, sans-serif" font-size="11" fill="#aaaaaa" text-anchor="start">Read</text>
    <text x="320" y="175" font-family="Arial, sans-serif" font-size="11" fill="#aaaaaa" text-anchor="start">Only</text>
    <text x="320" y="190" font-family="Arial, sans-serif" font-size="20" fill="#ff6b6b" text-anchor="start">🔒</text>
  </g>
  
  <!-- Arrow Image to Container -->
  <line x1="380" y1="250" x2="450" y2="250" stroke="#ffffff" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="415" y="235" font-family="monospace" font-size="10" fill="#ffffff">docker run</text>
  
  <!-- CONTAINER Section -->
  <text x="650" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#51cf66" text-anchor="middle">🚀 Contenedor (Read-Write)</text>
  
  <!-- Container Layers Stack -->
  <g transform="translate(470, 90)">
    <!-- R/W Layer (top) -->
    <rect x="0" y="0" width="300" height="50" rx="5" fill="url(#rwLayer)" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="150" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e" text-anchor="middle">📝 Capa de Escritura</text>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle">Thin R/W layer (Copy-on-Write)</text>
    
    <!-- Copied Image Layers (semi-transparent to show they're shared) -->
    <rect x="0" y="55" width="300" height="45" rx="5" fill="url(#layerGrad4)" opacity="0.7"/>
    <text x="150" y="80" font-family="Arial, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle">Capa 4 (readonly)</text>
    
    <rect x="0" y="105" width="300" height="45" rx="5" fill="url(#layerGrad3)" opacity="0.7"/>
    <text x="150" y="130" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Capa 3 (readonly)</text>
    
    <rect x="0" y="155" width="300" height="45" rx="5" fill="url(#layerGrad2)" opacity="0.7"/>
    <text x="150" y="180" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Capa 2 (readonly)</text>
    
    <rect x="0" y="205" width="300" height="45" rx="5" fill="url(#layerGrad1)" opacity="0.7"/>
    <text x="150" y="230" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Capa 1 - Base (readonly)</text>
    
    <!-- R/W indicator -->
    <text x="320" y="25" font-family="Arial, sans-serif" font-size="11" fill="#51cf66" text-anchor="start">Read</text>
    <text x="320" y="40" font-family="Arial, sans-serif" font-size="11" fill="#51cf66" text-anchor="start">Write</text>
    <text x="320" y="55" font-family="Arial, sans-serif" font-size="20" fill="#51cf66" text-anchor="start">✏️</text>
  </g>
  
  <!-- Key Concepts Box -->
  <rect x="50" y="370" width="380" height="115" rx="10" fill="#2d2d44"/>
  <text x="240" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd43b" text-anchor="middle">💡 Conceptos Clave</text>
  
  <text x="70" y="420" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Cada instrucción del Dockerfile crea una capa</text>
  <text x="70" y="440" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Las capas son inmutables y reutilizables (cache)</text>
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Los contenedores comparten capas de imagen</text>
  <text x="70" y="480" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">• Copy-on-Write: solo copia archivos modificados</text>
  
  <!-- Commands Box -->
  <rect x="470" y="370" width="380" height="115" rx="10" fill="#2d2d44"/>
  <text x="660" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2496ED" text-anchor="middle">🔧 Comandos Útiles</text>
  
  <text x="490" y="420" font-family="monospace" font-size="11" fill="#51cf66">docker history imagen:tag</text>
  <text x="740" y="420" font-family="Arial, sans-serif" font-size="10" fill="#aaaaaa">Ver capas</text>
  
  <text x="490" y="445" font-family="monospace" font-size="11" fill="#51cf66">docker inspect imagen:tag</text>
  <text x="740" y="445" font-family="Arial, sans-serif" font-size="10" fill="#aaaaaa">Detalles</text>
  
  <text x="490" y="470" font-family="monospace" font-size="11" fill="#51cf66">docker images --digests</text>
  <text x="740" y="470" font-family="Arial, sans-serif" font-size="10" fill="#aaaaaa">Ver SHA</text>
</svg>