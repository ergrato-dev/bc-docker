<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <style>
      .title { font-family:'Courier New',monospace; font-size:18px; font-weight:bold; fill:#34d399; }
      .label { font-family:'Courier New',monospace; font-size:11px; fill:#fff; font-weight:bold; }
      .sublabel { font-family:'Courier New',monospace; font-size:9px; fill:#94a3b8; }
      .cmd { font-family:'Courier New',monospace; font-size:10px; fill:#4ade80; }
      .bad { font-family:'Courier New',monospace; font-size:9px; fill:#f87171; }
      .note { font-family:'Courier New',monospace; font-size:9px; fill:#fbbf24; }
      .path { font-family:'Courier New',monospace; font-size:10px; fill:#93c5fd; }
    </style>
  </defs>
  <rect width="900" height="360" fill="url(#bg)" rx="12"/>
  <rect width="900" height="360" fill="none" stroke="#059669" stroke-width="1" stroke-opacity="0.5" rx="12"/>

  <text x="450" y="28" class="title" text-anchor="middle">Bind Mounts — Sincronización Host ↔ Contenedor</text>

  <!-- HOST filesystem box -->
  <rect x="20" y="45" width="360" height="280" rx="10" fill="#0f172a" stroke="#374151" stroke-width="1.5"/>
  <text x="200" y="66" class="label" text-anchor="middle" fill="#f59e0b">🖥️  HOST</text>
  <rect x="40" y="75" width="320" height="190" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="200" y="94" class="sublabel" text-anchor="middle">Sistema de archivos del host</text>
  <!-- Directory tree -->
  <text x="55" y="115" class="path">~/myapp/</text>
  <text x="70" y="132" class="path">├── src/</text>
  <text x="83" y="149" class="path">│   ├── app.py</text>
  <text x="83" y="166" class="path">│   └── utils.py</text>
  <text x="70" y="183" class="path">├── Dockerfile</text>
  <text x="70" y="200" class="path">└── requirements.txt</text>
  <!-- Edit indicator -->
  <rect x="280" y="140" width="65" height="22" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="312" y="156" class="cmd" text-anchor="middle" font-size="9">✏️  editas</text>
  <!-- Arrow to file -->
  <line x1="280" y1="151" x2="230" y2="151" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="233,147 225,151 233,155" fill="#10b981"/>

  <!-- Mount command -->
  <rect x="35" y="275" width="330" height="36" rx="6" fill="#111827" stroke="#374151"/>
  <text x="50" y="290" class="cmd" font-size="9">$ docker run -v $(pwd)/src:/app/src myapp</text>
  <text x="50" y="304" class="bad" font-size="8">  ← bind mount: ruta absoluta del host</text>

  <!-- CONTAINER filesystem box -->
  <rect x="520" y="45" width="360" height="280" rx="10" fill="#0f172a" stroke="#374151" stroke-width="1.5"/>
  <text x="700" y="66" class="label" text-anchor="middle" fill="#a78bfa">🐳  CONTENEDOR</text>
  <rect x="540" y="75" width="320" height="190" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="700" y="94" class="sublabel" text-anchor="middle">Filesystem del contenedor</text>
  <text x="555" y="115" class="path">/app/</text>
  <text x="570" y="132" class="path">├── src/               📌 bind</text>
  <text x="583" y="149" class="path" fill="#34d399">│   ├── app.py</text>
  <text x="583" y="166" class="path" fill="#34d399">│   └── utils.py</text>
  <text x="570" y="183" class="path">├── Dockerfile</text>
  <text x="570" y="200" class="path">└── requirements.txt</text>
  <!-- Sync indicator -->
  <rect x="680" y="140" width="68" height="22" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="714" y="156" class="cmd" text-anchor="middle" font-size="9">🔄 sync</text>

  <rect x="535" y="275" width="330" height="36" rx="6" fill="#111827" stroke="#374151"/>
  <text x="550" y="290" class="cmd" font-size="9">$ uvicorn app:main --reload</text>
  <text x="550" y="304" class="sublabel" font-size="8">  ← cambios en el host recargan la app</text>

  <!-- SYNC arrows (bidirectional, animated) -->
  <line x1="382" y1="155" x2="518" y2="155" stroke="#34d399" stroke-width="2.5" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <polygon points="515,150 523,155 515,160" fill="#34d399"/>

  <line x1="518" y1="170" x2="382" y2="170" stroke="#34d399" stroke-width="2.5" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <polygon points="385,166 377,170 385,174" fill="#34d399"/>

  <text x="450" y="162" class="label" text-anchor="middle" fill="#34d399" font-size="10">LIVE</text>
  <text x="450" y="175" class="sublabel" text-anchor="middle" font-size="8">sync</text>

  <!-- Nota abajo -->
  <rect x="20" y="340" width="860" height="15" rx="4" fill="#0f172a"/>
  <text x="450" y="351" class="note" text-anchor="middle">⚠️  Los bind mounts NO se gestionan con docker volume — dependen de la ruta del host — no aptos para producción portátil</text>
</svg>
