<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2496ED"/>
      <stop offset="100%" style="stop-color:#0d72b8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Tipos de Almacenamiento Persistente en Docker</text>
  <rect x="150" y="50" width="600" height="3" rx="1" fill="url(#blue)"/>

  <!-- === NAMED VOLUME === -->
  <rect x="30" y="70" width="250" height="180" rx="10" fill="#0f2a1f" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="70" width="250" height="36" rx="8" fill="#27ae60"/>
  <text x="155" y="93" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">📦 Named Volume</text>
  <text x="155" y="125" font-family="monospace" font-size="11" fill="#a8f0c6" text-anchor="middle">Gestionado por Docker</text>
  <text x="155" y="145" font-family="monospace" font-size="10" fill="#7fbfa0" text-anchor="middle">/var/lib/docker/volumes/</text>
  <text x="155" y="165" font-family="monospace" font-size="10" fill="#7fbfa0" text-anchor="middle">nombre-volumen/_data/</text>
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="11" fill="#2ecc71">✅ Producción</text>
  <text x="40" y="213" font-family="Arial, sans-serif" font-size="11" fill="#2ecc71">✅ Portátil</text>
  <text x="40" y="231" font-family="Arial, sans-serif" font-size="11" fill="#2ecc71">✅ Backup fácil</text>

  <!-- Code example Named Volume -->
  <rect x="30" y="270" width="250" height="55" rx="6" fill="#0a1628" stroke="#27ae60" stroke-width="1" stroke-opacity="0.5"/>
  <text x="42" y="290" font-family="monospace" font-size="10" fill="#666">$ </text>
  <text x="55" y="290" font-family="monospace" font-size="10" fill="#a8f0c6">docker run \</text>
  <text x="42" y="305" font-family="monospace" font-size="10" fill="#a8f0c6">  -v datos:/app/data \</text>
  <text x="42" y="320" font-family="monospace" font-size="10" fill="#a8f0c6">  mi-imagen</text>

  <!-- === BIND MOUNT === -->
  <rect x="325" y="70" width="250" height="180" rx="10" fill="#1f1a0f" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <rect x="325" y="70" width="250" height="36" rx="8" fill="#e67e22"/>
  <text x="450" y="93" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">🔗 Bind Mount</text>
  <text x="450" y="125" font-family="monospace" font-size="11" fill="#ffd9a8" text-anchor="middle">Gestionado por el usuario</text>
  <text x="450" y="145" font-family="monospace" font-size="10" fill="#c89060" text-anchor="middle">/home/user/proyecto/src</text>
  <text x="450" y="165" font-family="monospace" font-size="10" fill="#c89060" text-anchor="middle">(cualquier ruta del host)</text>
  <text x="335" y="195" font-family="Arial, sans-serif" font-size="11" fill="#e67e22">✅ Desarrollo / Hot reload</text>
  <text x="335" y="213" font-family="Arial, sans-serif" font-size="11" fill="#e67e22">✅ Edición desde IDE</text>
  <text x="335" y="231" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">⚠️  Cuidado en producción</text>

  <!-- Code example Bind Mount -->
  <rect x="325" y="270" width="250" height="55" rx="6" fill="#0a1628" stroke="#e67e22" stroke-width="1" stroke-opacity="0.5"/>
  <text x="337" y="290" font-family="monospace" font-size="10" fill="#666">$ </text>
  <text x="350" y="290" font-family="monospace" font-size="10" fill="#ffd9a8">docker run \</text>
  <text x="337" y="305" font-family="monospace" font-size="10" fill="#ffd9a8">  -v $(pwd)/src:/app \</text>
  <text x="337" y="320" font-family="monospace" font-size="10" fill="#ffd9a8">  mi-imagen</text>

  <!-- === TMPFS === -->
  <rect x="620" y="70" width="250" height="180" rx="10" fill="#1a0f2e" stroke="#9b59b6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="620" y="70" width="250" height="36" rx="8" fill="#9b59b6"/>
  <text x="745" y="93" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">⚡ tmpfs</text>
  <text x="745" y="125" font-family="monospace" font-size="11" fill="#d9b8ff" text-anchor="middle">Almacena en RAM</text>
  <text x="745" y="145" font-family="monospace" font-size="10" fill="#9b6bbf" text-anchor="middle">Memoria del host</text>
  <text x="745" y="165" font-family="monospace" font-size="10" fill="#9b6bbf" text-anchor="middle">(nunca toca el disco)</text>
  <text x="630" y="195" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">✅ Datos sensibles</text>
  <text x="630" y="213" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">✅ Máxima velocidad</text>
  <text x="630" y="231" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">❌ No persiste</text>

  <!-- Code example tmpfs -->
  <rect x="620" y="270" width="250" height="55" rx="6" fill="#0a1628" stroke="#9b59b6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="632" y="290" font-family="monospace" font-size="10" fill="#666">$ </text>
  <text x="645" y="290" font-family="monospace" font-size="10" fill="#d9b8ff">docker run \</text>
  <text x="632" y="305" font-family="monospace" font-size="10" fill="#d9b8ff">  --tmpfs /tmp:size=100m \</text>
  <text x="632" y="320" font-family="monospace" font-size="10" fill="#d9b8ff">  mi-imagen</text>

  <!-- Arrows pointing up from descriptions to boxes -->
  <!-- Animated data flow into container -->
  <line x1="155" y1="360" x2="155" y2="400" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="450" y1="360" x2="450" y2="400" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="745" y1="360" x2="745" y2="400" stroke="#9b59b6" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Container -->
  <rect x="100" y="400" width="700" height="60" rx="10" fill="#0f1c3f" stroke="#2496ED" stroke-width="2.5"/>
  <rect x="100" y="400" width="700" height="30" rx="8" fill="url(#blue)" opacity="0.7"/>
  <text x="450" y="420" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">🐳 Contenedor Docker</text>
  <text x="230" y="450" font-family="monospace" font-size="11" fill="#27ae60" text-anchor="middle">/app/data  →  datos</text>
  <text x="450" y="450" font-family="monospace" font-size="11" fill="#e67e22" text-anchor="middle">/app  →  $(pwd)/src</text>
  <text x="680" y="450" font-family="monospace" font-size="11" fill="#9b59b6" text-anchor="middle">/tmp  →  RAM</text>

  <!-- Animated dots flowing into container -->
  <circle r="5" fill="#27ae60">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>
  <path id="p1" d="M 155 360 L 155 400"/>

  <circle r="5" fill="#e67e22">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.5s">
      <mpath href="#p2"/>
    </animateMotion>
  </circle>
  <path id="p2" d="M 450 360 L 450 400"/>

  <circle r="5" fill="#9b59b6">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="1s">
      <mpath href="#p3"/>
    </animateMotion>
  </circle>
  <path id="p3" d="M 745 360 L 745 400"/>
</svg>
