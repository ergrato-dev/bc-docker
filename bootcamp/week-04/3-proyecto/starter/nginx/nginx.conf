# =============================================================================
# nginx.conf - Configuración de proxy reverso
# =============================================================================
# Esta configuración permite que nginx actúe como punto de entrada
# y redirija el tráfico al api-gateway

events {
    worker_connections 1024;
}

http {
    # Resolver DNS de Docker
    # TODO: Configurar el resolver DNS interno de Docker
    # El DNS interno de Docker está en 127.0.0.11
    # resolver 127.0.0.11 valid=10s;

    # Upstream para el API Gateway
    upstream api_backend {
        # TODO: Definir el servidor backend
        # El api-gateway está en la red app-net
        # server api-gateway:8080;
        server localhost:8080;  # Placeholder - cambiar
    }

    server {
        listen 80;
        server_name localhost;

        # Ruta principal
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # TODO: Configurar proxy para /api/
        # Todas las peticiones a /api/* deben ir al api-gateway
        # location /api/ {
        #     proxy_pass http://api_backend/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
