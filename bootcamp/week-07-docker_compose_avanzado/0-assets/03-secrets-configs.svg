<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0f1a0a"/>
    </linearGradient>
    <style>
      .title   { font-family:'Courier New',monospace; font-size:18px; font-weight:bold; fill:#4ade80; }
      .label   { font-family:'Courier New',monospace; font-size:10px; fill:#fff; font-weight:bold; }
      .sublabel{ font-family:'Courier New',monospace; font-size:9px; fill:#94a3b8; }
      .cmd     { font-family:'Courier New',monospace; font-size:9px; fill:#4ade80; }
      .key     { font-family:'Courier New',monospace; font-size:9px; fill:#a78bfa; }
      .val     { font-family:'Courier New',monospace; font-size:9px; fill:#4ade80; }
      .bad     { font-family:'Courier New',monospace; font-size:9px; fill:#f87171; }
      .note    { font-family:'Courier New',monospace; font-size:9px; fill:#fbbf24; }
    </style>
    <marker id="arrowy" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="url(#bg)" rx="12"/>
  <rect width="900" height="380" fill="none" stroke="#16a34a" stroke-width="1" stroke-opacity="0.5" rx="12"/>

  <text x="450" y="28" class="title" text-anchor="middle">Secrets y Configs en Docker Compose</text>

  <!-- Comparison header -->
  <text x="220" y="54" class="label" text-anchor="middle" fill="#f87171">❌ ENV VAR (inseguro)</text>
  <text x="680" y="54" class="label" text-anchor="middle" fill="#4ade80">✅ secret (seguro)</text>

  <!-- Env var side -->
  <rect x="20" y="62" width="400" height="90" rx="8" fill="#1a0505" stroke="#ef4444" stroke-width="1.5"/>
  <text x="30" y="80" class="sublabel" fill="#f87171"># compose.yml — NO hacer esto</text>
  <text x="30" y="96" class="cmd" xml:space="preserve">services:</text>
  <text x="30" y="110" class="cmd" xml:space="preserve">  app:</text>
  <text x="30" y="124" class="cmd" xml:space="preserve">    environment:</text>
  <text x="30" y="138" class="key" xml:space="preserve">      DB_PASSWORD: <tspan class="bad">mysecret123</tspan></text>
  <text x="30" y="142" class="bad">                  ^^ expuesto en docker inspect</text>

  <!-- Secret side -->
  <rect x="480" y="62" width="400" height="90" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
  <text x="490" y="80" class="sublabel" fill="#4ade80"># compose.yml — forma correcta</text>
  <text x="490" y="96" class="cmd" xml:space="preserve">services:</text>
  <text x="490" y="110" class="cmd" xml:space="preserve">  app:</text>
  <text x="490" y="124" class="cmd" xml:space="preserve">    secrets:</text>
  <text x="490" y="138" class="key" xml:space="preserve">      - <tspan class="val">db_password</tspan>     <tspan class="sublabel"># referencia</tspan></text>

  <!-- Arrow to mount -->
  <line x1="450" y1="105" x2="479" y2="105" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Mount path visualization -->
  <rect x="20" y="168" width="860" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="450" y="188" class="label" text-anchor="middle" fill="#4ade80">Cómo se monta el secret dentro del contenedor</text>

  <!-- Secret file flow -->
  <rect x="35" y="198" width="120" height="50" rx="6" fill="#1a1a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="95" y="217" class="note" text-anchor="middle">secrets:</text>
  <text x="95" y="231" class="key" text-anchor="middle">db_password:</text>
  <text x="95" y="245" class="cmd" text-anchor="middle">file: ./db_pass.txt</text>

  <line x1="156" y1="223" x2="200" y2="223" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowy)"/>

  <!-- docker secret object -->
  <rect x="202" y="198" width="110" height="50" rx="6" fill="#0f3a2a" stroke="#4ade80" stroke-width="1"/>
  <text x="257" y="217" class="label" text-anchor="middle">secret</text>
  <text x="257" y="231" class="sublabel" text-anchor="middle">objeto Docker</text>
  <text x="257" y="245" class="sublabel" text-anchor="middle">encriptado</text>

  <line x1="313" y1="223" x2="357" y2="223" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <!-- mount path -->
  <rect x="359" y="198" width="200" height="50" rx="6" fill="#1a0a3a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="459" y="217" class="key" text-anchor="middle">montado como archivo</text>
  <text x="459" y="231" class="val" text-anchor="middle">/run/secrets/db_password</text>
  <text x="459" y="245" class="sublabel" text-anchor="middle">solo lectura, en RAM</text>

  <line x1="560" y1="223" x2="604" y2="223" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <!-- app reads file -->
  <rect x="606" y="198" width="130" height="50" rx="6" fill="#1e3a2a" stroke="#4ade80" stroke-width="1"/>
  <text x="671" y="217" class="label" text-anchor="middle" fill="#4ade80">app lee el</text>
  <text x="671" y="231" class="cmd" text-anchor="middle">archivo en disco</text>
  <text x="671" y="245" class="sublabel" text-anchor="middle">no variable env 🔒</text>

  <!-- Bottom: configs section -->
  <rect x="20" y="284" width="415" height="78" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="227" y="302" class="label" text-anchor="middle" fill="#4ade80">configs: (archivos no sensibles)</text>
  <text x="30" y="318" class="sublabel">Similar a secrets pero para configuración pública</text>
  <text x="30" y="332" class="cmd" xml:space="preserve">configs:</text>
  <text x="30" y="346" class="key" xml:space="preserve">  nginx_conf:</text>
  <text x="30" y="360" class="key" xml:space="preserve">    file: <tspan class="val">./nginx.conf</tspan>  <tspan class="sublabel">→ /nginx.conf en contenedor</tspan></text>

  <!-- Bottom: comparison table -->
  <rect x="455" y="284" width="425" height="78" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="667" y="302" class="label" text-anchor="middle" fill="#4ade80">Secrets vs Configs</text>
  <text x="465" y="318" class="key">              secrets       configs</text>
  <text x="465" y="332" class="sublabel">Sensible:     ✅ sí          ❌ no</text>
  <text x="465" y="346" class="sublabel">Encriptado:   ✅ sí          ❌ no</text>
  <text x="465" y="360" class="sublabel">Ruta default: /run/secrets  /configurado</text>
</svg>
