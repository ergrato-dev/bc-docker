<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <!-- Gradiente de fondo oceánico -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    
    <!-- Gradiente para el agua -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:0.8"/>
    </linearGradient>
    
    <!-- Gradiente Docker azul -->
    <linearGradient id="dockerBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2496ED"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    
    <!-- Gradiente para contenedores -->
    <linearGradient id="containerGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </linearGradient>
    
    <linearGradient id="containerGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81D4FA"/>
      <stop offset="100%" style="stop-color:#4FC3F7"/>
    </linearGradient>
    
    <linearGradient id="containerGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B3E5FC"/>
      <stop offset="100%" style="stop-color:#81D4FA"/>
    </linearGradient>
    
    <!-- Brillo para texto -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    
    <!-- Efecto de brillo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Patrón de olas -->
    <pattern id="wavePattern" x="0" y="0" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q25 0 50 10 T100 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  
  <!-- Estrellas decorativas -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="100" cy="50" r="1"/>
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="350" cy="40" r="1"/>
    <circle cx="500" cy="70" r="1.2"/>
    <circle cx="700" cy="45" r="1"/>
    <circle cx="850" cy="65" r="1.5"/>
    <circle cx="1000" cy="55" r="1"/>
    <circle cx="1100" cy="75" r="1.2"/>
    <circle cx="150" cy="100" r="0.8"/>
    <circle cx="950" cy="90" r="0.8"/>
  </g>
  
  <!-- Agua / Mar animado -->
  <path d="M0 220 Q150 200 300 220 T600 220 T900 220 T1200 220 L1200 300 L0 300 Z" 
        fill="url(#waterGradient)" opacity="0.7"/>
  <path d="M0 235 Q150 220 300 235 T600 235 T900 235 T1200 235 L1200 300 L0 300 Z" 
        fill="url(#waterGradient)" opacity="0.5"/>
  <rect x="0" y="220" width="1200" height="80" fill="url(#wavePattern)"/>
  
  <!-- Ballena Docker -->
  <g transform="translate(80, 120)" filter="url(#shadow)">
    <!-- Cuerpo de la ballena -->
    <ellipse cx="90" cy="50" rx="85" ry="45" fill="url(#dockerBlue)"/>
    
    <!-- Cola -->
    <path d="M5 50 Q-30 20 -15 60 Q-30 90 5 60" fill="url(#dockerBlue)"/>
    
    <!-- Cabeza/Boca -->
    <ellipse cx="165" cy="55" rx="25" ry="20" fill="url(#dockerBlue)"/>
    
    <!-- Ojo -->
    <circle cx="160" cy="45" r="6" fill="#ffffff"/>
    <circle cx="162" cy="44" r="3" fill="#1a365d"/>
    
    <!-- Sonrisa -->
    <path d="M155 60 Q165 68 175 60" fill="none" stroke="#1a365d" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Chorro de agua -->
    <g transform="translate(90, -20)">
      <path d="M0 0 Q-10 -25 5 -40" fill="none" stroke="#81D4FA" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q10 -25 -5 -40" fill="none" stroke="#81D4FA" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-45" r="4" fill="#81D4FA"/>
      <circle cx="-8" cy="-38" r="3" fill="#B3E5FC"/>
      <circle cx="8" cy="-38" r="3" fill="#B3E5FC"/>
    </g>
    
    <!-- Contenedores sobre la ballena -->
    <g transform="translate(30, -30)">
      <!-- Fila inferior -->
      <rect x="0" y="20" width="28" height="25" rx="2" fill="url(#containerGradient1)" stroke="#1976D2" stroke-width="1"/>
      <rect x="32" y="20" width="28" height="25" rx="2" fill="url(#containerGradient2)" stroke="#1976D2" stroke-width="1"/>
      <rect x="64" y="20" width="28" height="25" rx="2" fill="url(#containerGradient1)" stroke="#1976D2" stroke-width="1"/>
      <rect x="96" y="20" width="28" height="25" rx="2" fill="url(#containerGradient3)" stroke="#1976D2" stroke-width="1"/>
      
      <!-- Fila superior -->
      <rect x="16" y="-8" width="28" height="25" rx="2" fill="url(#containerGradient2)" stroke="#1976D2" stroke-width="1"/>
      <rect x="48" y="-8" width="28" height="25" rx="2" fill="url(#containerGradient3)" stroke="#1976D2" stroke-width="1"/>
      <rect x="80" y="-8" width="28" height="25" rx="2" fill="url(#containerGradient1)" stroke="#1976D2" stroke-width="1"/>
      
      <!-- Detalles de contenedores (líneas) -->
      <g stroke="#1976D2" stroke-width="0.5" opacity="0.5">
        <line x1="5" y1="28" x2="23" y2="28"/>
        <line x1="37" y1="28" x2="55" y2="28"/>
        <line x1="69" y1="28" x2="87" y2="28"/>
        <line x1="101" y1="28" x2="119" y2="28"/>
        <line x1="21" y1="0" x2="39" y2="0"/>
        <line x1="53" y1="0" x2="71" y2="0"/>
        <line x1="85" y1="0" x2="103" y2="0"/>
      </g>
    </g>
  </g>
  
  <!-- Texto principal -->
  <g transform="translate(320, 80)">
    <!-- Docker -->
    <text x="0" y="50" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" 
          fill="url(#textGradient)" filter="url(#glow)">Docker</text>
    
    <!-- Zero to Hero -->
    <text x="0" y="110" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" 
          fill="#4FC3F7">Zero to Hero</text>
    
    <!-- Bootcamp badge -->
    <g transform="translate(360, 25)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#2196F3" opacity="0.9"/>
      <text x="65" y="22" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" 
            fill="#ffffff" text-anchor="middle">BOOTCAMP</text>
    </g>
  </g>
  
  <!-- Información del curso -->
  <g transform="translate(320, 200)">
    <!-- 8 semanas -->
    <g>
      <rect x="0" y="0" width="100" height="40" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="50" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" 
            fill="#ffffff" text-anchor="middle">8</text>
      <text x="50" y="33" font-family="Arial, Helvetica, sans-serif" font-size="11" 
            fill="#B3E5FC" text-anchor="middle">semanas</text>
    </g>
    
    <!-- 48 horas -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="100" height="40" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="50" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" 
            fill="#ffffff" text-anchor="middle">48</text>
      <text x="50" y="33" font-family="Arial, Helvetica, sans-serif" font-size="11" 
            fill="#B3E5FC" text-anchor="middle">horas</text>
    </g>
    
    <!-- Proyectos -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="100" height="40" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="50" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" 
            fill="#ffffff" text-anchor="middle">8</text>
      <text x="50" y="33" font-family="Arial, Helvetica, sans-serif" font-size="11" 
            fill="#B3E5FC" text-anchor="middle">proyectos</text>
    </g>
    
    <!-- Hands-on -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="110" height="40" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="55" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" 
            fill="#ffffff" text-anchor="middle">100%</text>
      <text x="55" y="33" font-family="Arial, Helvetica, sans-serif" font-size="11" 
            fill="#B3E5FC" text-anchor="middle">hands-on</text>
    </g>
  </g>
  
  <!-- Iconos decorativos a la derecha -->
  <g transform="translate(1050, 100)" opacity="0.6">
    <!-- Contenedor icon -->
    <rect x="0" y="0" width="40" height="35" rx="3" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    <line x1="5" y1="10" x2="35" y2="10" stroke="#4FC3F7" stroke-width="1"/>
    <circle cx="10" cy="5" r="2" fill="#4FC3F7"/>
    
    <!-- Flecha -->
    <path d="M50 17 L70 17 M65 12 L70 17 L65 22" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    
    <!-- Nube -->
    <path d="M90 25 Q85 15 95 12 Q100 5 115 10 Q130 5 130 18 Q140 20 135 30 L90 30 Q80 30 90 25" 
          fill="none" stroke="#4FC3F7" stroke-width="2"/>
  </g>
  
  <!-- Línea decorativa inferior -->
  <rect x="320" y="260" width="500" height="3" rx="1.5" fill="url(#dockerBlue)" opacity="0.5"/>
  
  <!-- Versión / Año -->
  <text x="1180" y="285" font-family="Arial, Helvetica, sans-serif" font-size="12" 
        fill="#4FC3F7" text-anchor="end" opacity="0.7">2025-2026</text>
</svg>